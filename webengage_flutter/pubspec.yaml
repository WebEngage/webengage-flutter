name: webengage_flutter
description: The WebEngage Flutter SDK offers solutions for mobile customer engagement, analytics, and retention.
version: 2.0.1
homepage: https://webengage.com/
repository: https://github.com/WebEngage/webengage-flutter/tree/master/webengage_flutter

environment:
  sdk: ">2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  webengage_flutter_platform_interface: ^2.0.0
  webengage_flutter_android: ^2.0.0
  webengage_flutter_web: ^2.0.0
  webengage_flutter_ios: ^2.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: webengage_flutter_android
      ios:
        default_package: webengage_flutter_ios
      web:
        default_package: webengage_flutter_web
