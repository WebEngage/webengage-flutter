name: webengage_flutter_location
description: "A companion plugin that adds the WebEngage Location SDK to your Flutter iOS app via Swift Package Manager."
version: 1.0.0
homepage: https://webengage.com/
repository: https://github.com/WebEngage/webengage-flutter/tree/master/webengage_flutter_location

environment:
  sdk: ">2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: WeLocationFlutterPlugin
